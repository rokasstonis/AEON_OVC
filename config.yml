session:
  subject_id: "BAA-1106718"
  session_id: "2025-04-02_001"
  experimenter: "Rokas"
  brain_region: "RSP"          # target region
  notes: ""

# ---- Paths ----
paths:
  raw_dir: "/media/rokas/Data/Temp/Ephys/Sample_data/020426"           # folder containing .bin + timestamps files /ceph/aeon/test2/scratchpad/Rokas/020426/2026-04-02T083238Z/NeuropixelsV2 
  processed_dir: "data/processed"
  sorted_dir: "data/sorted"
  results_dir: "results"

# ---- Probe geometry ----
probe:
  # Probe type — used by ProbeInterface to load geometry.
  # Options: "Neuropixels2.0-1shank"  or  "Neuropixels2.0-4shank"
  model: "Neuropixels2.0-4shank" #should be NP2013 for probeinterface to read it from the database, needs to be // TODO
  manufacturer: "imec"
  # If you exported a ProbeInterface JSON from Bonsai (recommended), set path here.
  # Leave null to use default geometry from ProbeInterface library.
  probeinterface_json: "probe_output_test.json"     # e.g. "data/raw/probe_config.json"

acquisition:
  gain_to_uV: 3.02734375 #// TODO: calculate from spike glx meta file gain_to_uV = (imAiRangeMax / imMaxInt) * (1 / imChan0apGain) * 1e6
  offset_to_uV: 0.0
  sampling_frequency: 30000  # Hz
  n_channels: 384
  dtype: "uint16" 

preprocessing:
  highpass_freq_min: 300
  n_channel_pad: 5
  # Bad channel detection
  bad_channel_score_threshold: 5
  # Spatial artifact removal strategy.
  # For single-shank: "car_global" or "car_local"
  # For quad-shank:   "destripe"  (IBL spatial high-pass filter)
  artifact_removal: "car_local"
  car_local_inner_radius_um: 50
  car_local_outer_radius_um: 100

sorting:
  sorter: "kilosort4"
  sorter_kwargs:
    do_correction: true
    Th_universal: 9
    Th_learned: 8
    nblocks: 5        # fine for single-shank NP2.0 — this is spatial blocks
                      # along the probe, not temporal. Leave at 5.
  n_jobs: 16          # increase from 8 — matches cpus-per-task in the job script
  chunk_duration: "2s"  # increase from 1s — HPC has more RAM, larger chunks
                        # means fewer reads from Ceph during preprocessing

quality_metrics:
  metrics:
    - firing_rate
    - presence_ratio
    - isi_violation
    - amplitude_cutoff
    - snr
    - drift
  isi_threshold_ms: 1.5
  min_isi_ms: 0.0